[workspace]
resolver = "3"
members = ["crates/elemental-pack", "crates/elemental-render"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"
repository = "https://github.com/kvnloo/elemental-ui"
rust-version = "1.88"

[workspace.dependencies]
elemental-pack = { path = "crates/elemental-pack" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
png = "0.18"
wgpu = "30"
pollster = "0.4"
bytemuck = { version = "1", features = ["derive"] }
