name: Blender PBR smoke

on:
  pull_request:
    paths:
      - "blender/**"
      - "materials/**"
      - "tools/elemental.py"
      - "tests/test_pbr_assets.py"
      - ".github/workflows/blender-smoke.yml"
  workflow_dispatch:

jobs:
  headless-cycles:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: blender/requirements.txt
      - name: Check contract without Blender dependency
        run: python -m unittest discover -s tests -p test_pbr_assets.py -v
      - name: Generate deterministic draft PBR maps
        run: python tools/elemental.py generate --size 128 --out web/assets
      - name: Verify all geology map packs before Blender import
        run: |
          python - <<'PY'
          from pathlib import Path
          from blender.pbr_assets import validate_maps
          for entry in sorted(Path("web/assets").glob("*/manifest.json")):
              manifest, maps = validate_maps("web/assets", entry.parent.name)
              print(manifest["material_id"], sorted(maps))
          PY
      - name: Install cached Blender Foundation wheel and image validator
        run: |
          python -m pip install --disable-pip-version-check --only-binary=:all: -r blender/requirements.txt
          python -c "import bpy; print('Blender', bpy.app.version_string)"
      - name: Render all three PBR packs under CPU Cycles
        run: |
          for material in geo.basalt.vesicular.v1 geo.slate.layered.v1 geo.limestone.porous.v1; do
            python blender/render_pbr_pack.py \
              --material "$material" \
              --map-root web/assets --out outputs/blender \
              --samples 4 --size 256
          done
      - name: Prevent material-family washout and black frames
        run: |
          for material in geo.basalt.vesicular.v1 geo.slate.layered.v1; do
            python blender/check_exposure.py \
              "outputs/blender/$material/pbr-preview.png" \
              --min-luma 8 --max-luma 185 \
              --report "outputs/blender/$material/exposure-receipt.json"
          done
          python blender/check_exposure.py \
            outputs/blender/geo.limestone.porous.v1/pbr-preview.png \
            --min-luma 30 --max-luma 235 \
            --report outputs/blender/geo.limestone.porous.v1/exposure-receipt.json
      - name: Verify render evidence exists for every first-wave material
        run: |
          for material in geo.basalt.vesicular.v1 geo.slate.layered.v1 geo.limestone.porous.v1; do
            test -s "outputs/blender/$material/pbr-preview.png"
            test -s "outputs/blender/$material/pbr-render-receipt.json"
            test -s "outputs/blender/$material/exposure-receipt.json"
          done
      - name: Upload headless Blender render and source receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: blender-pbr-smoke
          path: |
            outputs/blender/**/*.png
            outputs/blender/**/*.json
          if-no-files-found: warn
          retention-days: 14
