name: Geological reference integrity

on:
  pull_request:
    paths:
      - "references/**"
      - "tools/polyhaven.py"
      - "tests/test_polyhaven.py"
      - ".github/workflows/reference-smoke.yml"
  workflow_dispatch:

jobs:
  cc0-import:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify catalog, safe origins, bounds, MD5 and SHA256 using offline fixtures
        run: |
          python -m compileall -q tools/polyhaven.py tests/test_polyhaven.py
          python -m unittest discover -s tests -p test_polyhaven.py -v
          python tools/polyhaven.py list
      - name: Inspect official 1K scan map metadata (no asset download)
        run: python tools/polyhaven.py probe dark_rock --resolution 1k > /tmp/polyhaven-probe.log
      - name: Install preview-only dependency
        run: python -m pip install --disable-pip-version-check "Pillow==11.3.0"
      - name: Download one CC0 rock scan with publisher hashes and source credit
        run: python tools/polyhaven.py fetch dark_rock --resolution 1k --preview > /tmp/polyhaven-fetch.log
      - name: Verify receipt and contact sheet
        run: |
          test -s outputs/external/polyhaven/dark_rock/1k/reference-receipt.json
          test -s outputs/external/polyhaven/dark_rock/1k/contact-sheet.jpg
          python - <<'PY'
          import json
          from pathlib import Path
          receipt=json.loads(Path("outputs/external/polyhaven/dark_rock/1k/reference-receipt.json").read_text())
          assert receipt["source_license"] == "CC0-1.0"
          assert receipt["provider"] == "Poly Haven"
          assert len(receipt["files"]) >= 3
          assert all(v["bytes"] > 0 and len(v["sha256"]) == 64 for v in receipt["files"].values())
          print(receipt["asset_id"], receipt["creators"], sorted(receipt["files"]))
          print("Downloaded bytes:", sum(v["bytes"] for v in receipt["files"].values()))
          PY
      - name: Upload reference previews, provenance and checksums (not source maps)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: polyhaven-reference-evidence
          path: |
            outputs/external/polyhaven/**/contact-sheet.jpg
            outputs/external/polyhaven/**/reference-receipt.json
          if-no-files-found: warn
          retention-days: 14
