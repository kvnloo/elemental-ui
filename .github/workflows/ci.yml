name: Core validation

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile Python sources
        run: python -m compileall -q tools tests blender
      - name: Validate material recipes
        run: python tools/elemental.py validate
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Generate low-resolution PBR sample
        run: python tools/elemental.py generate --size 64 --out outputs/smoke
      - name: Verify manifests and artifact checksums
        run: python tools/elemental.py validate --out outputs/smoke
      - name: Check browser script
        run: node --check web/app.js
      - name: Build preview gallery assets
        run: python tools/elemental.py generate --size 256 --out web/assets
      - name: Upload browsable preview files
        uses: actions/upload-artifact@v4
        with:
          name: elemental-ui-demo
          path: web/
          if-no-files-found: error
          retention-days: 14

  browser:
    name: Chromium functional and responsive QA
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned browser harness
        run: |
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps chromium
      - name: Generate three material texture packs
        run: python tools/elemental.py generate --size 128 --out web/assets
      - name: Exercise semantic controls, keyboard, responsive layout, and reduced motion
        run: python -m unittest discover -s tests/browser -v
      - name: Upload mobile/desktop screenshots and size receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-qa-receipts
          path: reports/generated/browser/
          if-no-files-found: warn
          retention-days: 14


  runtime-packs:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Build and verify runtime packs
        run: |
          python tools/elemental.py pack --size 128
          python tools/elemental.py pack --verify
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Rust tests (pack contract, shader validation; GPU render skips without an adapter)
        run: cargo test --release --locked
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install naga for the GLSL drift check
        run: cargo install naga-cli --version 30.0.1 --locked
      - name: Web runtime build
        run: |
          npm ci
          npm run glsl:check -w @elemental-ui/web
          npm run typecheck
          npm run build
